# cargo-deny policy. Run: cargo deny check
# (cargo tree/metadata need `-p kernel --target x86_64-unknown-none` because of
# -Z bindeps; cargo-deny handles the workspace, but pass --all-features off.)

[graph]
targets = ["x86_64-unknown-none", "x86_64-unknown-linux-gnu"]

[advisories]
# bincode 1.3.3 is unmaintained (RUSTSEC-2025-0141) and only reaches the build
# through the bootloader's build script; there is no fixed release.
#
# rsa 0.9 has the Marvin timing side channel (RUSTSEC-2023-0071) in *private-key*
# operations (decryption/signing). The browser uses `rsa` only to VERIFY public-key
# signatures on server certificates (tlsverify): the OS holds no RSA private key,
# so there is nothing for the timing leak to recover. No patched release exists.
ignore = ["RUSTSEC-2025-0141", "RUSTSEC-2023-0071"]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "0BSD",
  "CC0-1.0", "MPL-2.0",
]
confidence-threshold = 0.9

# Kitsune itself is source-available (PolyForm Strict), not published to crates.io:
# the license policy above applies to its dependencies only.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
