# cargo-audit policy (the same exceptions as deny.toml, with the same reasons).
[advisories]
ignore = [
  # rsa "Marvin Attack": a timing side channel in RSA *private-key* operations
  # (decryption/signing). OSjeff only verifies RSA signatures of public
  # certificates and holds no RSA private key, so the channel is not reachable.
  # No fixed release exists.
  "RUSTSEC-2023-0071",
  # bincode 1.3.3 is unmaintained and only reaches the build through the
  # bootloader's build script; there is no fixed release.
  "RUSTSEC-2025-0141",
]
