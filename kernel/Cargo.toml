[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11"
osjeff_core = { path = "../osjeff_core" }
x86_64 = "0.15"
# no_std TCP/IP stack layered over our NE2000 driver (the browser's networking).
smoltcp = { version = "0.12", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-dns",
] }
# TLS 1.3 for HTTPS (the browser's search). no_std, no alloc — uses heapless.
# `UnsecureProvider` skips certificate verification (demo-grade: good enough to
# reach search engines; NOT production-secure).
embedded-tls = { version = "0.19", default-features = false }
embedded-io = "0.7"
rand_core = { version = "0.6.3", default-features = false }
# The `x86_64-unknown-none` target compiles with SSE disabled, so the crypto
# crates' SIMD backends fail to codegen ("Do not know how to split the result of
# this operator"). sha2 exposes a `force-soft` cargo feature; aes/polyval/ghash
# are forced to their software backends via `--cfg` flags in `.cargo/config.toml`.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# WebAssembly interpreter — the OS's native app format. no_std, alloc-based.
wasmi = { version = "1", default-features = false }

# Host-only: assembles the demo WAT into binary .wasm at build time (see build.rs).
[build-dependencies]
wat = "1"

# The kernel binary is bare-metal: never built or run as a host test target.
[[bin]]
name = "kernel"
test = false
bench = false
