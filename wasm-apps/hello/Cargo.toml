# The smallest Kitsune app: a greeting that counts key presses. Starting point for
# new apps (see docs/BUILDING.md, "Como criar um app").
[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kitsune-sdk = { path = "../sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
