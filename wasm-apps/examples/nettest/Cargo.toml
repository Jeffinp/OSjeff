# A test fixture, NOT bundled in the image: exercises `net_http_get` against the fake
# public server of tools/nettest-server.py (see docs/TESTING.md, "Rede dos apps").
# Build:  cd wasm-apps/examples/nettest && cargo build --release --target wasm32-unknown-unknown
[package]
name = "nettest"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kitsune-sdk = { path = "../../sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
