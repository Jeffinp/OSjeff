# Analog + digital clock (ABI v2, event driven: one `on_tick` per second).
[package]
name = "clock"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
kitsune-sdk = { path = "../sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
