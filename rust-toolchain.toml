[toolchain]
# Pinned to a dated nightly: the previous unpinned "nightly" made the build
# non-reproducible (it broke when core::iter::Step grew `forward_overflowing`
# until x86_64 0.15.5 shipped). Bump deliberately, together with Cargo.lock.
channel = "nightly-2026-10-05"
components = ["rust-src", "llvm-tools", "clippy", "rustfmt"]
targets = ["x86_64-unknown-none", "wasm32-unknown-unknown"]
