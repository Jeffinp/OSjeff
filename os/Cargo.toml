[package]
name = "os"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
publish = false

[features]
# `cargo build --release -p os --features perf-trace` bakes the kernel's
# measurement build (serial `[trace]` lines) into the image.
perf-trace = ["kernel/perf-trace"]

# The kernel is built for bare metal and embedded by the build script.
# Artifact deps consumed in build.rs must live under [build-dependencies].
[build-dependencies]
bootloader = "0.11"

[build-dependencies.kernel]
path = "../kernel"
artifact = "bin"
target = "x86_64-unknown-none"
